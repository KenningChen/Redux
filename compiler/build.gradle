plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'kotlin-kapt'
    id 'maven-publish'
}

group = 'ceneax.app.lib'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    implementation project(':annotation')

    implementation "com.squareup:kotlinpoet:1.10.2"

    // KSP 处理器 API(1.0.x 为 KSP1 API,版本前缀与消费方 Kotlin 版本对齐)
    implementation "com.google.devtools.ksp:symbol-processing-api:1.9.20-1.0.14"

    implementation 'com.google.auto.service:auto-service:1.0'
    kapt "com.google.auto.service:auto-service:1.0"
}

publishing {
    publications {
        maven(MavenPublication) {
            // JitPack 形态坐标(JitPack 发布时强制重写 groupId/version 为 tag,不影响发布;
            // 本地联调期可临时改 SNAPSHOT 后 publishToMavenLocal)
            groupId 'com.github.KenningChen.Redux'
            artifactId 'compiler'
            // JitPack 发布时强制重写为 tag 版本,此值仅影响本地 publishToMavenLocal 形态
            version '0.5.10'
            from components.java
        }
    }
}
buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://jitpack.io' }
        google()
        mavenCentral()
    }
    dependencies {
        // KSP(demo app 用;classpath 本体方式,不依赖 gradlePluginPortal 的插件 marker——JitPack 环境曾因 marker 全仓未命中构建失败)
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:1.9.20-1.0.14"
        // Redux 插件
        classpath 'com.github.ceneax.Redux:plugin:0.2.0'
    }
}

plugins {
    id 'com.android.application' version '7.2.1' apply false
    id 'com.android.library' version '7.2.1' apply false
    // 1.9.20 与 WMS 主线 Kotlin 版本对齐(KSP symbol-processing-api 1.9.20-1.0.14 要求)
    id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
    id 'org.jetbrains.kotlin.jvm' version '1.9.20' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
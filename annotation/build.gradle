plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'maven-publish'
}

group = 'com.github.KenningChen.Redux'
// compiler POM 的 annotation 依赖坐标取自 project version,发版需显式版本(随 tag 同步;
// JitPack 发布时强制重写为 tag 版本,此值仅影响本地 publishToMavenLocal 形态)
version = '0.5.10'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId 'com.github.KenningChen.Redux'
            artifactId 'annotation'
            version '0.5.9'
            from components.java
        }
    }
}